[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dgc-viewer"
version = "1.0.0"
description = "Standalone PyQt6 GUI viewer and exporter for DisplaceBox .dgc metadata files"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "stakan", url = "https://github.com/stakanyash" }
]
dependencies = [
    "PyQt6>=6.12.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: X11 Applications :: Qt",
    "Topic :: Multimedia :: Graphics :: Viewers",
]

[project.urls]
"Homepage" = "https://github.com/stakanyash/DGC_viewer"
"Bug Tracker" = "https://github.com/stakanyash/DGC_viewer/issues"

[project.scripts]
dgc-viewer = "dgc_viewer:main"

[tool.hatch.build.targets.wheel]
include = ["dgc_viewer.py"]

[dependency-groups]
dev = [
    "nuitka>=2.0.0",
]